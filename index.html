  (function(){
    try{
      var t = localStorage.getItem('awakening-path:theme');
      document.documentElement.setAttribute('data-theme', t === 'retro' ? 'retro' : 'dark');
    }catch(e){ document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
<style>
  @font-face{font-family:'Orbitron';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/orbitron-500.woff2') format('woff2');}

  @font-face{font-family:'Chakra Petch';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/chakra-petch-600.woff2') format('woff2');}

  @font-face{font-family:'Space Mono';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/space-mono-400.woff2') format('woff2');}
  @font-face{font-family:'Space Mono';font-weight:700;font-style:normal;font-display:swap;src:url('fonts/space-mono-700.woff2') format('woff2');}
  :root, [data-theme="dark"] {
    --bg: #0a0a0f; --bg2: #12121f;
    --panel: rgba(10, 10, 15, 0.88); --panel2: rgba(18, 18, 31, 0.92);
    --line: rgba(0, 240, 255, 0.5); --line-dim: rgba(0, 240, 255, 0.2);
    --accent: #00f0ff; --accent-glow: rgba(0, 240, 255, 0.7); --accent-soft: rgba(0, 240, 255, 0.08);
    --magenta: #ff2bd6; --magenta-glow: rgba(255, 43, 214, 0.6);
    --gold: #ffd700; --gold-glow: rgba(255, 215, 0, 0.6);
    --text: #e8f0f8; --text-dim: #7f8fa6;
    --danger: #ff0055; --danger-glow: rgba(255, 0, 85, 0.6);
    --success: #00ff66;
    --header-bg: rgba(10, 10, 15, 0.9); --bottom-bg: rgba(10, 10, 15, 0.95);
    --bg-radial: radial-gradient(circle at 30% 10%, #1a1a2e 0%, #0a0a0f 70%);
    --overlay-bg: rgba(0, 0, 0, 0.85);
    --progress-track: #1a1a2e;
    --progress-fill-start: var(--accent); --progress-fill-end: var(--magenta);
    --progress-glow: var(--accent-glow);
    --panel-clip: polygon(0 12px, 12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px));
    --panel-clip-lg: polygon(0 20px, 20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px));
    --heat-empty-bg: rgba(255,255,255,0.04); --heat-empty-border: var(--line-dim);
    --heat-incomplete-bg: #ff2b4a; --heat-incomplete-shadow: 0 0 6px rgba(255,43,74,0.6);
    --heat-partial-bg: #ffc400; --heat-partial-shadow: 0 0 6px rgba(255,196,0,0.6);
    --heat-complete-bg: #22e070; --heat-complete-shadow: 0 0 6px rgba(34,224,112,0.6);
    --heat-rested-bg: #3a7bd5; --heat-rested-shadow: 0 0 6px rgba(58,123,213,0.6);
    --heat-frozen-bg: #a8e0ff; --heat-frozen-shadow: 0 0 8px rgba(168,224,255,0.85);
    --heat-cell-radius: 2px; --heat-today-outline: 1px solid var(--gold);
    --freeze-bg: rgba(126, 184, 255, 0.08); --freeze-fg: #7eb8ff;
    --freeze-border: #7eb8ff; --freeze-glow: rgba(126, 184, 255, 0.6);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text); }
  body { background: var(--bg-radial); font-family: 'Rajdhani', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; overflow-x: hidden; position: relative; }
  body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(rgba(0,240,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    -webkit-mask-image: radial-gradient(circle at 50% 20%, #000 0%, rgba(0,0,0,0.3) 50%, transparent 80%);
    mask-image: radial-gradient(circle at 50% 20%, #000 0%, rgba(0,0,0,0.3) 50%, transparent 80%); }
  body::after { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(0,240,255,0.02) 3px, rgba(0,240,255,0.02) 4px); }
  #root { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 120px; }
  header.hud { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; background: var(--header-bg); backdrop-filter: blur(16px);
    border-bottom: 2px solid var(--line); box-shadow: 0 4px 30px rgba(0,0,0,0.5); }
  .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 0.15em; font-size: 16px;
    color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); display: flex; flex-direction: column; line-height: 1.1; }
  .logo em { font-style: normal; }
  .logo span { font-size: 9px; letter-spacing: 0.3em; color: var(--text-dim); text-shadow: none; font-weight: 400; }
  .hud-chip { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-dim); border: 1px solid var(--line); padding: 4px 12px; background: var(--accent-soft);
    box-shadow: 0 0 12px var(--accent-glow);
    clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px); }
  .hud-chip b { color: var(--accent); font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 0.05em; text-shadow: 0 0 8px var(--accent-glow); }
  main { flex: 1; padding: 20px 16px 8px; touch-action: pan-y; position: relative; }
  .sys-panel-wrapper { position: relative; padding: 2px; margin-bottom: 18px; background: var(--line);
    clip-path: var(--panel-clip); box-shadow: 0 0 20px var(--accent-glow); filter: drop-shadow(0 0 15px var(--accent-glow)); }
  .sys-panel { position: relative; background: var(--panel); backdrop-filter: blur(8px); padding: 20px;
    clip-path: var(--panel-clip); border: 1px solid transparent; }
  .sys-panel::after { content: ''; position: absolute; inset: 0; pointer-events: none; clip-path: var(--panel-clip);
    background: linear-gradient(135deg, var(--line) 0%, transparent 40%, transparent 60%, var(--line) 100%); opacity: 0.2; }
  h1.page-title { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.3em;
    color: var(--text); margin: 4px 0 18px; text-transform: uppercase; display: flex; align-items: center; gap: 12px;
    text-shadow: 0 0 15px var(--accent-glow); }
  h1.page-title::before { content: ''; width: 6px; height: 20px; background: var(--accent); box-shadow: 0 0 20px var(--accent); }
  h1.page-title.centered { justify-content: center; }
  h1.page-title.centered::before { display: none; }
  .penalty-warning { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 28px; margin-bottom: 16px; padding: 14px 18px;
    border: 1px solid var(--danger); background: rgba(255,0,85,0.1); font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.05em; color: var(--danger); text-align: center; text-transform: uppercase; font-weight: 700;
    box-shadow: 0 0 40px var(--danger-glow), inset 0 0 20px var(--danger-glow);
    clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
    animation: dangerPulse 2.5s ease-in-out infinite; }
  .next-cycle-note { text-align: center; margin: 0 0 16px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.08em; color: var(--text-dim); text-transform: uppercase; }
  .next-cycle-note b { color: var(--accent); font-weight: 700; }
  [data-theme="retro"] .next-cycle-note { font-family: 'Space Mono', monospace; letter-spacing: 0.04em; }
  @keyframes dangerPulse { 0%,100% { box-shadow: 0 0 30px var(--danger-glow), inset 0 0 15px var(--danger-glow); }
    50% { box-shadow: 0 0 60px var(--danger-glow), inset 0 0 30px var(--danger-glow); } }
  .train-grid .sys-panel-wrapper, .train-grid .sys-panel { clip-path: var(--panel-clip-lg); }
  .quest-card .qhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
  .qhead .qname { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.15em;
    color: var(--text); display: flex; align-items: center; flex-wrap: nowrap; gap: 8px; }
  .qhead .qnum { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
  .qhead .qnum .goal { color: var(--text-dim); font-weight: 400; }
  .bar-track { height: 12px; background: var(--progress-track); border: 1px solid var(--line-dim); position: relative; overflow: hidden;
    margin-bottom: 16px; clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--progress-fill-start), var(--progress-fill-end));
    box-shadow: 0 0 20px var(--progress-glow); transition: width 0.3s ease; }
  .bar-fill.done { background: linear-gradient(90deg, #ffae00, var(--gold)); box-shadow: 0 0 25px var(--gold-glow); }
  .btn-container { display: flex; flex-direction: column; gap: 6px; }
  .add-btn { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px;
    background: var(--accent-soft); border: 1px solid var(--line); color: var(--accent); padding: 10px 0; cursor: pointer;
    letter-spacing: 0.05em; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    text-align: center; transition: background 0.15s, color 0.15s, box-shadow 0.15s; box-shadow: 0 0 8px var(--accent-soft); }
  .add-btn:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 20px var(--accent-glow); }
  .sub-btn { background: rgba(255,0,85,0.1); border-color: var(--danger); color: var(--danger); }
  .sub-btn:hover { background: var(--danger); color: #fff; box-shadow: 0 0 20px var(--danger-glow); }
  .rest-btn { background: rgba(255,215,0,0.08); border-color: var(--gold); color: var(--gold); }
  .rest-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold-glow); }

  /* ===== Riga input allenamento: [-] [n] [+] [Rest] ===== */
  .btn-input-row { display: grid; grid-template-columns: 1fr 1.5fr 1fr 1.5fr; gap: 6px; align-items: stretch; }
  .btn-input-row .add-btn { height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; }
  .step-input { display: block; width: 100%; min-width: 0; height: 38px; box-sizing: border-box;
    padding: 0 6px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px;
    text-align: center; color: var(--accent); background: var(--panel2); border: 1px solid var(--line);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5); outline: none; -webkit-appearance: none; appearance: none; }
  .step-input::-webkit-outer-spin-button, .step-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .step-input:focus { border-color: var(--accent); background: var(--accent-soft); color: var(--text);
    box-shadow: 0 0 15px var(--accent-glow), inset 0 0 10px rgba(0,0,0,0.5); }
  [data-theme="retro"] .step-input { font-family: 'Chakra Petch', sans-serif; font-size: 16px; color: var(--text);
    background: var(--panel); border: 2px solid var(--line); border-radius: 3px; box-shadow: none; clip-path: none; }
  [data-theme="retro"] .step-input:focus { border-color: var(--accent); background: var(--panel); color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft); }

  .cleared-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--gold); border: 1px solid var(--gold); background: rgba(255,215,0,0.15); padding: 2px 8px;
    white-space: nowrap; flex: 0 0 auto;
    box-shadow: 0 0 12px var(--gold-glow); }
  .undo-btn { width: 100%; margin: 14px 0 0; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 0.1em; background: var(--accent-soft); border: 1px solid var(--line); color: var(--accent); cursor: pointer;
    clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
    transition: background 0.15s, color 0.15s, box-shadow 0.15s, transform 0.08s; }
  .undo-btn:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 20px var(--accent-glow); }
  .undo-btn:active { transform: translateY(1px); }
  .freeze-btn { width: 100%; margin: 8px 0 18px; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 0.1em; background: var(--freeze-bg); border: 1px solid var(--freeze-border); color: var(--freeze-fg); cursor: pointer;
    clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
    transition: background 0.15s, color 0.15s, box-shadow 0.15s, transform 0.08s; }
  .freeze-btn:hover { background: var(--freeze-fg); color: var(--bg); box-shadow: 0 0 20px var(--freeze-glow); }
  .freeze-btn.active { background: var(--freeze-fg); color: var(--bg); box-shadow: 0 0 20px var(--freeze-glow); animation: freezePulse 3s ease-in-out infinite; }
  .freeze-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .freeze-btn:disabled:hover { background: var(--freeze-bg); color: var(--freeze-fg); box-shadow: none; }
  .freeze-btn:active { transform: translateY(1px); }
  @keyframes freezePulse { 0%,100% { box-shadow: 0 0 15px var(--freeze-glow); } 50% { box-shadow: 0 0 35px var(--freeze-glow); } }
  .heatmap-header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .sys-panel.heatmap-panel { padding: 14px; }
  .heatmap-title { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.15em;
    color: var(--accent); text-transform: uppercase; text-shadow: 0 0 12px var(--accent-glow); }
  .heatmap-subtitle { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
  .rem-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); }
  .rem-row input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; margin-right: 8px; vertical-align: middle; }
  .rem-time { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); background: var(--panel2); border: 1px solid var(--line); padding: 6px 8px; color-scheme: dark; }
  .rem-time:disabled { opacity: 0.4; }
  .rem-status { margin-top: 10px; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid var(--line-dim); color: var(--text-dim); }
  .rem-status.on { color: var(--success); border-color: var(--success); }
  .rem-status.off { color: var(--gold); border-color: var(--gold); }
  [data-theme="retro"] .rem-time, [data-theme="retro"] .rem-row, [data-theme="retro"] .rem-status { font-family: 'Space Mono', monospace; }
  [data-theme="retro"] .rem-time { border-width: 2px; border-radius: 3px; }
  .heatmap-scroll { overflow-x: auto; overflow-y: hidden; padding: 2px 2px 4px; scrollbar-width: thin; scrollbar-color: var(--line-dim) transparent; }
  .heatmap-inner { --hm-max: clamp(9px, 2.6vw, 13px); --hm-min: 8px; --hm-gap: 2px; width: max-content; max-width: 100%; min-width: calc(var(--weeks) * (var(--hm-min) + var(--hm-gap))); margin: 0 auto; }
  .heatmap-month-row { display: grid; gap: var(--hm-gap); margin-bottom: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-dim); letter-spacing: 0.03em; text-transform: uppercase; }
  .heatmap-month { white-space: nowrap; overflow: hidden; padding-left: 1px; }
  .heatmap-grid { display: grid; grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: var(--hm-gap); }
  .heatmap-cell { aspect-ratio: 1; border-radius: var(--heat-cell-radius); background: var(--heat-empty-bg);
    border: 1px solid var(--heat-empty-border); box-sizing: border-box; transition: transform 0.1s, box-shadow 0.1s; }
  .heatmap-cell--incomplete { background: var(--heat-incomplete-bg); border-color: transparent; box-shadow: var(--heat-incomplete-shadow); }
  .heatmap-cell--partial    { background: var(--heat-partial-bg);    border-color: transparent; box-shadow: var(--heat-partial-shadow); }
  .heatmap-cell--complete   { background: var(--heat-complete-bg);   border-color: transparent; box-shadow: var(--heat-complete-shadow); }
  .heatmap-cell--rested     { background: var(--heat-rested-bg);     border-color: transparent; box-shadow: var(--heat-rested-shadow); }
  .heatmap-cell--frozen {
    background:
      radial-gradient(circle at 28% 22%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 45%),
      radial-gradient(circle at 72% 78%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(135deg, #e8f7ff 0%, #b3e5ff 25%, #7ec8f5 50%, #a8dcff 75%, #e8f7ff 100%);
    border-color: rgba(255,255,255,0.6);
    box-shadow:
      0 0 8px rgba(126, 200, 245, 0.9),
      inset 1px 1px 2px rgba(255, 255, 255, 0.95),
      inset -1px -1px 2px rgba(60, 120, 180, 0.45);
    position: relative;
    overflow: hidden;
  }
  .heatmap-cell--frozen::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(45deg,  transparent 42%, rgba(255,255,255,0.75) 50%, transparent 58%),
      linear-gradient(-45deg, transparent 42%, rgba(255,255,255,0.4)  50%, transparent 58%);
    pointer-events: none;
  }
  .heatmap-cell--future   { background: transparent; border-color: var(--heat-empty-border); opacity: 0.3; }
  .heatmap-cell.is-today  { outline: var(--heat-today-outline); outline-offset: 1px; }
  .heatmap-legend {
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: center;
    gap: 6px 12px; margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-dim); letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .heatmap-legend .legend-item { display: flex; align-items: center; gap: 6px; }
  .heatmap-legend .heatmap-cell { width: 10px; height: 10px; aspect-ratio: auto; flex-shrink: 0; }
  .backup-status { padding: 10px 14px; margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 0.05em; border: 1px solid; text-transform: uppercase; }
  .backup-status.ok      { color: var(--success); border-color: var(--success); background: rgba(0,255,102,0.05); }
  .backup-status.due     { color: var(--gold); border-color: var(--gold); background: rgba(255,215,0,0.05); }
  .backup-status.overdue { color: var(--danger); border-color: var(--danger); background: rgba(255,0,85,0.08); }
  .daily-complete-popup { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

  /* ===== Info page: curtain sections ===== */
  .sys-panel.info-section { padding: 0; }

    width: 100%; margin: 0; padding: 17px 44px; background: none; border: none; cursor: pointer;

  .info-content > :last-child { margin-bottom: 0; }

  .info-section.danger .info-chevron { color: var(--danger); }

    letter-spacing: .02em; text-transform: uppercase; color: var(--text); text-shadow: none; padding: 15px 44px; }
  [data-theme="retro"] .info-head:hover,
  [data-theme="retro"] .info-section.open > .info-head { background: var(--accent-soft); color: var(--accent); }

  }

  /* ---------- Profiles ---------- */
  function uid(){ return 'p_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function makeProfile(name, exercises, goals){
    return { id: uid(), name: name || 'New Profile', exercises: (exercises || []).slice(), goals: goals || {} };
  }
  const REVERSE_WRIST_KEY = 'x_dumbbell_reverse_wrist_curls';
  function legacyKey(x){ return x === 'wrist' ? REVERSE_WRIST_KEY : x; }
  function defaultExercises(){ return ['steps','pushups','squats','crunches',REVERSE_WRIST_KEY]; }
  function getProfileById(id){ return profiles.find(p => p.id === id) || null; }
  function getActiveProfile(){ return getProfileById(activeProfileId) || profiles[0] || null; }

  /* The current cycle ALWAYS follows the active profile, so profiles can be
     swapped at any time. Past cycles are frozen via their exSnapshot. */
  function getProfileForDay(dk){
    const c = getCurrentCycle();
    if (c && dk === c.startDay){
      const p = getProfileById(activeProfileId);
      if (p) return p;
    }
    if (logs[dk] && logs[dk].profileId){
      const p = getProfileById(logs[dk].profileId);
      if (p) return p;
    }
    return profiles[0] || null;
  }
  const LEGACY_EXERCISES = ['steps','pushups','squats','crunches','x_dumbbell_reverse_wrist_curls'];
  function firstWristDay(){
    let first = null;
    for (const k in logs){
      const e = logs[k]; if (!e) continue;
      const has = (e[REVERSE_WRIST_KEY] || 0) > 0 || (Array.isArray(e.restedTypes) && e.restedTypes.includes(REVERSE_WRIST_KEY));
      if (has && (first === null || k < first)) first = k;
    }
    return first;
  }
  function getActiveExercises(dk){
    const c = getCurrentCycle();
    const isCurrentCycle = !!(c && dk === c.startDay);
    const e = logs[dk];
    if (!isCurrentCycle && e && Array.isArray(e.exSnapshot)) return e.exSnapshot.filter(x => EXERCISE_REGISTRY[x]);
    const p = getProfileForDay(dk);
    let list = p ? p.exercises.filter(x => EXERCISE_REGISTRY[x]) : [];
    if (isLegacyDay(dk)){
      const fw = firstWristDay();
      list = list.filter(x => LEGACY_EXERCISES.includes(x) && (x !== REVERSE_WRIST_KEY || (fw !== null && dk >= fw)));
    }
    return list;
  }
  function snapshotPastDays(){
    const c = getCurrentCycle();
    if (!c) return false;
    let changed = false;
    for (const k in logs){
      const e = logs[k];
      if (!e || k >= c.startDay || Array.isArray(e.exSnapshot)) continue;
      e.exSnapshot = getActiveExercises(k);
      changed = true;
    }
    if (changed){ LocalStore.set('logs', JSON.stringify(logs)); markTimelineDirty(); }
    return changed;
  }
  function getBaseGoal(type, dk){
    const p = getProfileForDay(dk);
    const override = p && p.goals ? p.goals[type] : undefined;
    if (typeof override === 'number' && override > 0) return override;
    const reg = EXERCISE_REGISTRY[type];
    return reg ? reg.goal : 100;
  }
  function getModeMult(dk){ return getModeForDate(dk) === 'hard' ? HARD_MULT : 1; }
  function isLegacyDay(dk){ return !!goalCutover && dk < goalCutover; }
  function legacyFixed(type){
    if (type === 'steps') return { goal: 10000, xp: 100 };
    if (type === REVERSE_WRIST_KEY) return { goal: 200, xp: 100 };
    return null;
  }
  function getGoalForExercise(type, dk){
    if (isLegacyDay(dk)){
      const p = getProfileForDay(dk);
      const ov = p && p.goals ? p.goals[type] : undefined;
      if (typeof ov === 'number' && ov > 0) return ov;
      const lf = legacyFixed(type);
      if (lf) return lf.goal;
      return getModeForDate(dk) === 'hard' ? 100 : 60;
    }
    return Math.max(1, Math.round(getBaseGoal(type, dk) * getModeMult(dk)));
  }

  /* ===== XP MODEL =====
     Every exercise has a TOTAL reward for fully completing its quota:
        normal : 60 XP
        hard   : 60 * 5/3 = 100 XP
     XP is earned PROGRESSIVELY, in proportion to how much of the quota you
     have logged:
        xp = (value / goal) * total
     So 1,000 of 12,000 steps = 60 * 1000/12000 = 5 XP,
        3,000 of 12,000 steps = 15 XP,
     and finishing the quota banks the full 60.
     The rank multiplier is applied on top of this (see computeXPTimeline). */
  function getExerciseTotalXP(type, dk){
    return Math.round(XP_PER_EXERCISE * getModeMult(dk) * 100) / 100;
  }
  /* Kept for legacy (pre-cutover) days only. */
  function getMaxXPForExercise(type, dk){
    const reg = EXERCISE_REGISTRY[type];
    if (!reg) return 100;
    const lf = legacyFixed(type);
    if (lf) return lf.xp;
    return getModeForDate(dk) === 'hard' ? 100 : 60;
  }
  function getStepAmount(type){
    const pref = stepPrefs[type];
    if (typeof pref === 'number' && pref > 0) return pref;
    const reg = EXERCISE_REGISTRY[type];
    return reg && reg.stepDefault ? reg.stepDefault : 1;
  }
  function hasAnyData(entry){
    if (!entry) return false;
    for (const t of Object.keys(EXERCISE_REGISTRY)){ if ((entry[t] || 0) > 0) return true; }
    if (entry.restedTypes && entry.restedTypes.length > 0) return true;
    return false;
  }
  function initGoalCutover(candidate){
    if (typeof candidate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(candidate)){ goalCutover = candidate; }
    else {
      let c = null;
      try { c = getCurrentCycle(); } catch(e){}
      goalCutover = (c && c.startDay) ? c.startDay : todayKey();
    }
    LocalStore.set('goalCutover', goalCutover);
    markTimelineDirty();
  }
  function ensureProfilesMigrated(){
    (profiles || []).forEach(p => {
      if (Array.isArray(p.exercises)){
        p.exercises = p.exercises.map(legacyKey).filter((x, i, a) => a.indexOf(x) === i);
      }
      if (p.goals && typeof p.goals.wrist === 'number'){
        if (typeof p.goals[REVERSE_WRIST_KEY] !== 'number') p.goals[REVERSE_WRIST_KEY] = p.goals.wrist;
        delete p.goals.wrist;
      }
    });
    if (typeof stepPrefs.wrist === 'number'){
      if (stepPrefs.wrist !== 5) stepPrefs[REVERSE_WRIST_KEY] = stepPrefs.wrist;
      delete stepPrefs.wrist;
    }
    for (const k in logs){
      const e = logs[k]; if (!e) continue;
      if (typeof e.wrist === 'number'){ e[REVERSE_WRIST_KEY] = (e[REVERSE_WRIST_KEY] || 0) + e.wrist; delete e.wrist; }
      if (Array.isArray(e.restedTypes) && e.restedTypes.includes('wrist')){
        e.restedTypes = e.restedTypes.map(legacyKey).filter((x, i, a) => a.indexOf(x) === i);
      }
    }
    if (!Array.isArray(profiles) || profiles.length === 0){
      profiles = [makeProfile('Total Body', defaultExercises(), {})];
      activeProfileId = profiles[0].id;
    }
    if (!activeProfileId || !getProfileById(activeProfileId)) activeProfileId = profiles[0].id;
    for (const t of Object.keys(EXERCISE_REGISTRY)){
      if (typeof stepPrefs[t] !== 'number' || stepPrefs[t] < 1) stepPrefs[t] = EXERCISE_REGISTRY[t].stepDefault;
    }
  }

  function getGoalsForDate(dk){ const g = {}; for (const t of getActiveExercises(dk)) g[t] = getGoalForExercise(t, dk); return g; }
  function isDayComplete(dk, entry){
    if(!entry) return false;
    const rested = entry.restedTypes || [];
    const goals = getGoalsForDate(dk);
    for(const t in goals){ const v = entry[t] || 0; if (!rested.includes(t) && v < goals[t]) return false; }
    return true;
  }
  function timeUntilDeadline(){
    const c = getCurrentCycle();
    if (!c) return { text: '00:00:00', totalMs: 0 };
    const diff = Math.max(0, c.endMs - Date.now());
    const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
    return { text: String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'), totalMs: diff };
  }
  function fmtDate(key){ const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
  function fmtDateShort(key){ const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d).toLocaleDateString('en-US', { month:'short', day:'numeric' }); }
  function dowOf(key){ const [y,m,d] = key.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short'}); }

  /* ---------- Streak freeze ---------- */
  function isValidKey(k){ return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k); }
  function cycleStartDayOf(idx){ return keyOf(new Date(cycleStartMsOf(idx))); }
  function getFreezesUsedThisMonth(){ const ym = todayKey().slice(0, 7); return freezeStarts.filter(k => k.startsWith(ym)).length; }
  function freezesRemaining(){ return Math.max(0, FREEZE_BUDGET_PER_MONTH - getFreezesUsedThisMonth()); }
  function freezeCycleNumber(){ const c = getCurrentCycle(); return (freezeActiveSince && c && freezeFromIdx !== null) ? c.index - freezeFromIdx + 1 : 0; }
  function saveFreezeState(){ LocalStore.set('freezeState', JSON.stringify({ activeSince: freezeActiveSince, fromIdx: freezeFromIdx, starts: freezeStarts })); }
  function migrateFreezeState(){
    freezeStarts = []; freezeActiveSince = null; freezeFromIdx = null; _freezeSyncedIdx = null;
    const cur = getCurrentCycle();
    const idxs = Array.from(new Set(Object.keys(frozenDays).filter(isValidKey).map(k => { const c = cycleForDay(k); return c ? c.index : null; }).filter(i => i !== null))).sort((a, b) => a - b);
    let runStart = null, prev = null;
    const closeRun = () => { if (runStart !== null) freezeStarts.push(cycleStartDayOf(runStart)); };
    for (const i of idxs) { if (prev === null || i !== prev + 1) { closeRun(); runStart = i; } prev = i; }
    closeRun();
    if (cur && prev === cur.index) { freezeFromIdx = runStart; freezeActiveSince = cycleStartDayOf(runStart); }
    saveFreezeState();
  }
  function syncFreeze(force){
    if (!freezeActiveSince || freezeFromIdx === null) return false;
    const c = getCurrentCycle();
    if (!c) return false;
    if (!force && _freezeSyncedIdx === c.index) return false;
    _freezeSyncedIdx = c.index;
    let changed = false;
    for (let i = freezeFromIdx; i <= c.index; i++) { const k = cycleStartDayOf(i); if (!frozenDays[k]) { frozenDays[k] = true; changed = true; } }
    if (changed) { LocalStore.set('frozenDays', JSON.stringify(frozenDays)); markTimelineDirty(); }
    return changed;
  }

  /* ---------- XP: proportional model ---------- */
  function dayXP(key){
    if(frozenDays[key]) return 0;
    if(penalties[key]) return -DAILY_PENALTY;
    const entry = logs[key];
    if(!entry) return 0;
    const rested = entry.restedTypes || [];
    const goals = getGoalsForDate(key);
    let sum = 0;
    if (isLegacyDay(key)){
      /* legacy proportional model using the old per-exercise maxXP */
      for(const type in goals){
        const v = entry[type] || 0;
        if (rested.includes(type)) continue;
        const goal = goals[type];
        const maxXP = getMaxXPForExercise(type, key);
        sum += Math.min(v, goal) / goal * maxXP;
      }
      return sum;
    }
    /* new model: value / goal * totalExerciseXP, capped at the total */
    for(const type in goals){
      if (rested.includes(type)) continue;
      const v = entry[type] || 0;
      const goal = goals[type];
      const totalXP = getExerciseTotalXP(type, key);
      const progressed = Math.min(v, goal) / goal;
      sum += progressed * totalXP;
    }
    return sum;
  }
  function getMultiplierForRank(rank){ return RANK_MULTIPLIERS[rank] || 1.0; }

  /* Converts raw XP into effective XP, switching to the new rank's multiplier
     the moment a rank boundary is crossed (even mid-day / mid-input). */
  const RANK_START_LEVELS = [['E',1],['D',5],['C',10],['B',15],['A',25],['S',40],['SS',65],['Monarch',99]];
  function applyRankMultiplier(startXP, raw){
    if (raw <= 0) return raw * getMultiplierForRank(rankOf(calcLevel(startXP).level));
    let pos = startXP, remaining = raw, gained = 0, guard = 0;
    while (remaining > 1e-9 && guard++ < 20){
      const rank = rankOf(calcLevel(pos).level);
      const mult = getMultiplierForRank(rank);
      const idx = RANK_START_LEVELS.findIndex(r => r[0] === rank);
      const next = RANK_START_LEVELS[idx + 1];
      if (!next){ gained += remaining * mult; break; }
      const room = totalXpForLevel(next[1]) - pos;   /* effective XP left in this rank */
      const rawNeeded = room / mult;
      if (remaining <= rawNeeded){ gained += remaining * mult; break; }
      gained += room; remaining -= rawNeeded; pos += room;
    }
    return gained;
  }

  let _timelineCache = null, _timelineDirty = true;
  function markTimelineDirty(){ _timelineDirty = true; }
  function computeXPTimeline(){
    if (!_timelineDirty && _timelineCache) return _timelineCache;
    const days = Array.from(new Set([...Object.keys(logs), ...Object.keys(penalties), ...Object.keys(frozenDays)])).sort();
    let cumulative = 0, total = 0;
    const perDay = {}, rankPerDay = {}, restPenalty = {}, restHeavy = {}, restStreakPerDay = {};
    let restStreak = 0;
    for(const k of days){
      let raw = dayXP(k);
      /* Rest-heavy streak: >50% of exercises rested = rest-heavy cycle; >50% truly done resets the streak.
         Frozen / failed cycles neither add to nor reset it. */
      if (!frozenDays[k] && !penalties[k] && logs[k]){
        const active = getActiveExercises(k), n = active.length;
        if (n > 0){
          const entry = logs[k], rested = entry.restedTypes || [];
          const restedCount = active.filter(t => rested.includes(t)).length;
          const doneCount = active.filter(t => !rested.includes(t) && (entry[t] || 0) >= getGoalForExercise(t, k)).length;
          if (restedCount * 2 > n){
            restStreak++; restHeavy[k] = true;
            if (restStreak > REST_GRACE_CYCLES){ restPenalty[k] = true; raw -= DAILY_PENALTY; }
          } else if (doneCount * 2 > n){
            restStreak = 0;
          }
        }
      }
      restStreakPerDay[k] = restStreak;
      const rankBefore = rankOf(calcLevel(cumulative).level);
      const effective = applyRankMultiplier(cumulative, raw);
      perDay[k] = effective;
      rankPerDay[k] = rankBefore;
      cumulative += effective;
      total += effective;
    }
    _timelineCache = { perDay, rankPerDay, total, restPenalty, restHeavy, restStreakPerDay, restStreak };
    _timelineDirty = false;
    return _timelineCache;
  }
  function totalXP(){ return computeXPTimeline().total; }
  function calcLevel(xpRaw){
    const xp = Math.max(0, xpRaw);
    let level=1, rem=xp, need=150;
    while(rem >= need){ rem -= need; level++; need = 150 + (level-1)*25; }
    return { level, xpIntoLevel:rem, xpForNext:need };
  }
  function rankOf(level){
    if(level>=99) return 'Monarch'; if(level>=65) return 'SS'; if(level>=40) return 'S';
    if(level>=25) return 'A'; if(level>=15) return 'B'; if(level>=10) return 'C';
    if(level>=5) return 'D'; return 'E';
  }
  function lifetimeTotal(type){
    let sum=0;
    for(const k in logs){ const e = logs[k]; if (e && e.restedTypes && e.restedTypes.includes(type)) continue; sum += (e[type]||0); }
    return sum;
  }
  function categoryTotal(catId){
    let sum = 0;
    for (const k of Object.keys(EXERCISE_REGISTRY)){
      if (EXERCISE_REGISTRY[k].cats.includes(catId)) sum += lifetimeTotal(k);
    }
    return sum;
  }

  function calcStreaks(){
    const cur = getCurrentCycle();
    const idxSet = new Set();
    for (const k of new Set([...Object.keys(logs), ...Object.keys(frozenDays)])) { const c = cycleForDay(k); if (c) idxSet.add(c.index); }
    let current = 0;
    if (cur) { let i = idxSet.has(cur.index) ? cur.index : cur.index - 1; while (idxSet.has(i)) { current++; i--; } }
    let longest = 0, run = 0, prev = null;
    for (const i of Array.from(idxSet).sort((x, y) => x - y)) { run = (prev !== null && i === prev + 1) ? run + 1 : 1; longest = Math.max(longest, run); prev = i; }
    return { current, longest: Math.max(longest, current) };
  }

  const STORE_PREFIX = 'awakening-path:';
  const LocalStore = {
    get(key){ try{ const v = localStorage.getItem(STORE_PREFIX+key); return v===null ? null : { value:v }; }catch(e){ return null; } },
    set(key, value){ try{ localStorage.setItem(STORE_PREFIX+key, value); return { value }; }catch(e){ console.error('local save failed', e); return null; } }
  };

  function setTheme(next, opts){
    const silent = opts && opts.silent;
    theme = next === 'retro' ? 'retro' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    LocalStore.set('theme', theme);
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute('content', theme === 'retro' ? '#141414' : '#0a0a0f');
    if (!silent) render();
  }

  async function loadData(){
    try{ const l = LocalStore.get('logs'); logs = l && l.value ? JSON.parse(l.value) : {}; }catch(e){ logs = {}; }
    try{ const p = LocalStore.get('profile'); profileName = (p && p.value) ? (JSON.parse(p.value).name || 'Hunter') : 'Hunter'; }catch(e){ profileName = 'Hunter'; }
    try{ const pen = LocalStore.get('penalties'); const parsed = pen && pen.value ? JSON.parse(pen.value) : {};
      penalties = parsed.penalties || {}; lastJudgedDate = parsed.lastJudgedDate || null;
      lastJudgedCycleIdx = (typeof parsed.lastJudgedCycleIdx === 'number') ? parsed.lastJudgedCycleIdx : null;
    }catch(e){ penalties = {}; lastJudgedDate = null; lastJudgedCycleIdx = null; }
    try{ const f = LocalStore.get('frozenDays'); frozenDays = f && f.value ? JSON.parse(f.value) : {}; }catch(e){ frozenDays = {}; }
    try{ const b = LocalStore.get('lastBackupDate'); lastBackupDate = b && b.value ? JSON.parse(b.value) : null; }catch(e){ lastBackupDate = null; }
    try{ const a = LocalStore.get('cycleAnchor'); cycleAnchor = a && a.value ? JSON.parse(a.value) : null; }catch(e){ cycleAnchor = null; }
    try{ const s = LocalStore.get('settings'); const parsed = s && s.value ? JSON.parse(s.value) : {};
      defaultMode = parsed.defaultMode === 'hard' ? 'hard' : 'normal'; wristStartDate = parsed.wristStartDate || todayKey(); }
    catch(e){ defaultMode = 'normal'; wristStartDate = todayKey(); }
    try{
      const sp = LocalStore.get('stepPrefs');
      if (sp && sp.value){
        const p = JSON.parse(sp.value);
        for (const k in p){ if (typeof p[k] === 'number' && p[k] > 0) stepPrefs[k] = p[k]; }
      }
    }catch(e){}
    try{ const pr = LocalStore.get('profiles'); profiles = pr && pr.value ? JSON.parse(pr.value) : []; }catch(e){ profiles = []; }
    try{ const ap = LocalStore.get('activeProfileId'); activeProfileId = ap && ap.value ? JSON.parse(ap.value) : null; }catch(e){ activeProfileId = null; }
    if (!wristStartDate) wristStartDate = todayKey();
    if (!cycleAnchor){ cycleAnchor = computeAnchor(); await saveCycleAnchor(); }
    try{
      const fs = LocalStore.get('freezeState');
      if (fs && fs.value) {
        const p = JSON.parse(fs.value);
        freezeActiveSince = isValidKey(p.activeSince) ? p.activeSince : null;
        freezeFromIdx = (typeof p.fromIdx === 'number' && freezeActiveSince) ? p.fromIdx : null;
        freezeStarts = Array.isArray(p.starts) ? p.starts.filter(isValidKey) : [];
        if (freezeActiveSince && freezeFromIdx === null) { freezeActiveSince = null; }
      } else { migrateFreezeState(); }
    }catch(e){ migrateFreezeState(); }
    ensureProfilesMigrated();
    { const gc = LocalStore.get('goalCutover'); initGoalCutover(gc && gc.value ? gc.value : null); }
    snapshotPastDays();
    await saveLogs();
    saveStepPrefs();
    await saveSettings();
    await saveProfiles();
    await saveActiveProfileId();
    markTimelineDirty();
  }
  async function saveLogs(){ LocalStore.set('logs', JSON.stringify(logs)); markTimelineDirty(); }
  async function saveProfile(){ LocalStore.set('profile', JSON.stringify({name:profileName})); }
  async function savePenalties(){ LocalStore.set('penalties', JSON.stringify({penalties, lastJudgedDate, lastJudgedCycleIdx})); markTimelineDirty(); }
  async function saveFrozenDays(){ LocalStore.set('frozenDays', JSON.stringify(frozenDays)); markTimelineDirty(); }
  async function saveLastBackupDate(){ LocalStore.set('lastBackupDate', JSON.stringify(lastBackupDate)); }
  async function saveSettings(){ LocalStore.set('settings', JSON.stringify({defaultMode, wristStartDate})); markTimelineDirty(); }
  async function saveCycleAnchor(){ LocalStore.set('cycleAnchor', JSON.stringify(cycleAnchor)); markTimelineDirty(); }
  function saveStepPrefs(){ LocalStore.set('stepPrefs', JSON.stringify(stepPrefs)); }
  function saveProfiles(){ LocalStore.set('profiles', JSON.stringify(profiles)); }
  function saveActiveProfileId(){ LocalStore.set('activeProfileId', JSON.stringify(activeProfileId)); }

  async function judgeCycles(){
    syncFreeze();
    const current = getCurrentCycle();
    if (!current || cycleAnchor === null) return false;
    if (lastJudgedCycleIdx === null){
      lastJudgedCycleIdx = current.index - 1;
      await savePenalties();
      return false;
    }
    if (lastJudgedCycleIdx >= current.index - 1) return false;
    let changed = false;
    let idx = lastJudgedCycleIdx + 1;
    while (idx <= current.index - 1){
      const startDay = cycleStartDayOf(idx);
      if (!frozenDays[startDay] && !isDayComplete(startDay, logs[startDay])){
        penalties[startDay] = true;
        changed = true;
      }
      idx++;
    }
    lastJudgedCycleIdx = current.index - 1;
    await savePenalties();
    return changed;
  }

  function sysPanel(inner, cls){ return '<div class="sys-panel-wrapper"><div class="sys-panel '+(cls||'')+'">'+inner+'</div></div>'; }
  function infoSection(id, title, body, opts){
    const open = !!infoOpen[id];
    const danger = !!(opts && opts.danger);
    const group = !!(opts && opts.group);
    return '<div class="sys-panel-wrapper"><div class="sys-panel info-section' + (open ? ' open' : '') + (danger ? ' danger' : '') + (group ? ' info-group' : '') + '">' +
        '<button class="info-head" type="button" data-section="' + id + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
          '<span class="info-head-title">' + title + '</span>' +
          '<span class="info-chevron" aria-hidden="true">▾</span>' +
        '</button>' +
        '<div class="info-body"><div class="info-body-inner"><div class="info-content">' + body + '</div></div></div>' +
      '</div></div>';
  }
  function infoSub(id, title, body){
    const open = !!infoOpen[id];
    return '<div class="info-section info-sub' + (open ? ' open' : '') + '">' +
        '<button class="info-head" type="button" data-section="' + id + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
          '<span class="info-head-title">' + title + '</span><span class="info-chevron" aria-hidden="true">▾</span>' +
        '</button>' +
        '<div class="info-body"><div class="info-body-inner"><div class="info-content">' + body + '</div></div></div>' +
      '</div>';
  }
  function toast(msg, cls){
    const wrap = document.getElementById('toast-wrap');
    const el = document.createElement('div');
    el.className = 'toast '+(cls||'');
    el.textContent = msg;
    el.style.opacity = '1';
    wrap.appendChild(el);
    setTimeout(()=>{ el.remove(); }, 2200);
  }

  function pushUndo(dateKey, label){

    if(undoStack.length > MAX_UNDO) undoStack.shift();

  async function performUndo(){

    else logs[item.dateKey] = item.snapshot;

  function totalXpForLevel(level){ if (level <= 1) return 0; const n = level - 1; return n * 150 + 25 * n * (n - 1) / 2; }
  function getRankThresholds(){
    const ranks = ['E','D','C','B','A','S','SS','Monarch'];
    const thresholds = {};
    const levels = { E:1, D:5, C:10, B:15, A:25, S:40, SS:65, Monarch:99 };
    for (const r of ranks) thresholds[r] = totalXpForLevel(levels[r]);
    thresholds['Monarch'] = totalXpForLevel(100);
    return thresholds;
  }

  async function importData(file){
    if(!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!parsed || typeof parsed !== 'object' || typeof parsed.logs !== 'object'){ toast('Invalid backup file', 'warn'); return; }
      logs = parsed.logs || {}; penalties = parsed.penalties || {}; frozenDays = parsed.frozenDays || {};
      lastJudgedDate = parsed.lastJudgedDate || null;
      lastJudgedCycleIdx = (typeof parsed.lastJudgedCycleIdx === 'number') ? parsed.lastJudgedCycleIdx : null;
      cycleAnchor = (typeof parsed.cycleAnchor === 'number') ? parsed.cycleAnchor : null;
      lastBackupDate = parsed.lastBackupDate || new Date().toISOString();
      profileName = (parsed.profile && parsed.profile.name) || 'Hunter';
      if (parsed.settings) { defaultMode = parsed.settings.defaultMode === 'hard' ? 'hard' : 'normal'; wristStartDate = parsed.settings.wristStartDate || todayKey(); }
      else { defaultMode = 'normal'; wristStartDate = todayKey(); }
      stepPrefs = Object.fromEntries(Object.entries(EXERCISE_REGISTRY).map(([k, v]) => [k, v.stepDefault]));
      if (parsed.stepPrefs && typeof parsed.stepPrefs === 'object'){
        for (const k in parsed.stepPrefs){ if (typeof parsed.stepPrefs[k] === 'number' && parsed.stepPrefs[k] > 0) stepPrefs[k] = parsed.stepPrefs[k]; }
      }
      if (Array.isArray(parsed.profiles) && parsed.profiles.length){
        profiles = parsed.profiles.map(p => ({
          id: typeof p.id === 'string' ? p.id : uid(),
          name: typeof p.name === 'string' ? p.name.slice(0, 20) : 'Profile',
          exercises: Array.isArray(p.exercises) ? p.exercises.map(legacyKey).filter(x => EXERCISE_REGISTRY[x]) : defaultExercises(),
          goals: (p.goals && typeof p.goals === 'object') ? p.goals : {}
        }));
        activeProfileId = (typeof parsed.activeProfileId === 'string' && profiles.find(x => x.id === parsed.activeProfileId))
          ? parsed.activeProfileId : profiles[0].id;
      } else {
        profiles = []; activeProfileId = null;
      }
      if (!cycleAnchor){ cycleAnchor = computeAnchor(); }
      if ('freezeStarts' in parsed || 'freezeActiveSince' in parsed) {
        freezeActiveSince = isValidKey(parsed.freezeActiveSince) ? parsed.freezeActiveSince : null;
        freezeFromIdx = (typeof parsed.freezeFromIdx === 'number' && freezeActiveSince) ? parsed.freezeFromIdx : null;
        freezeStarts = Array.isArray(parsed.freezeStarts) ? parsed.freezeStarts.filter(isValidKey) : [];
        if (freezeActiveSince && freezeFromIdx === null) freezeActiveSince = null;
        _freezeSyncedIdx = null; saveFreezeState();
      } else { migrateFreezeState(); }
      ensureProfilesMigrated();
      initGoalCutover(parsed.goalCutover);
      snapshotPastDays();
      await saveLogs(); await savePenalties(); await saveFrozenDays();
      await saveLastBackupDate(); await saveProfile(); await saveSettings(); await saveCycleAnchor();
      saveStepPrefs(); saveProfiles(); saveActiveProfileId();
      await judgeCycles();
      undoStack = [];
      toast('[ IMPORTED ] Backup restored', 'clear');
      render();
    }catch(e){ toast('Could not read that backup file', 'warn'); }
  }

  function daysSinceBackup(){
    if(!lastBackupDate) return null;
    const dt = new Date(lastBackupDate);
    if(isNaN(dt.getTime())) return null;
    return Math.floor((Date.now() - dt.getTime()) / 86400000);
  }
  function backupState(){
    const days = daysSinceBackup();
    const totalDaysLogged = Object.keys(logs).length;
    if(days === null){
      if(totalDaysLogged >= 3) return { level: 'overdue', days: null, text: '⚠ NO BACKUP ON FILE · Your progress is at risk' };
      return { level: 'ok', days: null, text: 'No backup yet — will remind you after a few days of training' };
    }
    if(days >= BACKUP_INTERVAL_DAYS) return { level: 'overdue', days, text: '⚠ BACKUP OVERDUE · ' + days + ' days since last export' };
    if(days >= BACKUP_INTERVAL_DAYS - 3) return { level: 'due', days, text: 'Backup due soon · Last export ' + days + ' days ago' };
    return { level: 'ok', days, text: '✓ Backed up ' + (days === 0 ? 'today' : days + ' day' + (days === 1 ? '' : 's') + ' ago') };
  }
  function checkBackupNagOnLaunch(){
    const state = backupState();
    if(state.level === 'overdue') setTimeout(()=>toast('⚠ BACKUP OVERDUE — Open the menu (☰) and export a backup to protect your progress', 'warn'), 1200);
  }

  function fmtLeft(ms){ const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000); return h >= 1 ? h + 'h ' + String(m).padStart(2, '0') + 'm' : m + 'm'; }
  async function toggleFreeze(){
    const cycle = getCurrentCycle();
    if (!cycle) return;
    const logDay = cycle.startDay;
    syncFreeze();
    if (freezeActiveSince) {
      const n = freezeCycleNumber();
      const sameCycle = freezeFromIdx === cycle.index;
      freezeActiveSince = null; freezeFromIdx = null; _freezeSyncedIdx = null;
      delete frozenDays[logDay];
      let refunded = false;
      if (sameCycle) { freezeStarts.pop(); refunded = true; }
      await saveFrozenDays(); saveFreezeState();
      buzz(12);
      toast(refunded ? '❄ Freeze cancelled — it has been refunded'
                     : '❄ Freeze stopped after ' + n + ' cycle' + (n === 1 ? '' : 's') + ' — current cycle is active, ' + fmtLeft(Math.max(0, cycle.endMs - Date.now())) + ' left', 'clear');
      render(); return;
    }
    if (freezesRemaining() <= 0) { buzz([8,40,8]); toast('❄ No freeze left this month (' + FREEZE_BUDGET_PER_MONTH + '/' + FREEZE_BUDGET_PER_MONTH + ' used)', 'warn'); return; }
    if (logs[logDay] && isDayComplete(logDay, logs[logDay])) { buzz([8,40,8]); toast('Cycle already complete — freeze not needed', 'clear'); return; }
    freezeActiveSince = todayKey(); freezeFromIdx = cycle.index; _freezeSyncedIdx = null;
    freezeStarts.push(freezeActiveSince);
    frozenDays[logDay] = true;
    await saveFrozenDays(); saveFreezeState();
    buzz([15,50,15]);
    toast('❄ [ STREAK FREEZE ] Active until you stop it — no penalty', 'clear');
    render();
  }

  function nextCycleNote(cycle, frozen){

    const d = new Date(cycle.endMs);
    const t = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');

  }

  function renderHeatmap(){
    const cur = getCurrentCycle();
    const todayStr = todayKey();
    const ROWS = 7;
    const total = cur ? cur.index + 1 : 1;
    const COLS = Math.max(1, Math.ceil(total / ROWS));
    const cells = [];
    for (let i = 0; i < COLS * ROWS; i++){
      const info = cycleInfo(i);
      cells.push({ idx: i, logDay: info.startDay, endDay: keyOf(new Date(info.endMs - 1)), future: !cur || i > cur.index, isCurrent: !!cur && i === cur.index });
    }
    const monthStarts = [];
    let lastMonth = -1;
    for (let c = 0; c < COLS; c++){
      const [y, m] = cells[c * ROWS].logDay.split('-').map(Number);
      if (m !== lastMonth){
        monthStarts.push({ index: c, name: new Date(y, m-1, 1).toLocaleDateString('en-US', { month: 'short' }) });
        lastMonth = m;
      }
    }
    let monthRow = '';
    monthStarts.forEach((m, i) => {
      const endIdx = i + 1 < monthStarts.length ? monthStarts[i + 1].index : COLS;
      monthRow += '<div class="heatmap-month" style="grid-column:' + (m.index + 1) + ' / ' + (endIdx + 1) + ';">' + m.name + '</div>';
    });
    const timeline = computeXPTimeline();
    function cellStatus(cell){
      const logDay = cell.logDay;
      if (cell.future) return { cls: 'future', tip: '' };
      if (frozenDays[logDay]) return { cls: 'frozen', tip: '❄ Cycle frozen (no XP)' };
      if (penalties[logDay]) return { cls: 'incomplete', tip: '✗ Cycle missed — no training logged' };
      const entry = logs[logDay];
      if (!entry) return { cls: 'incomplete', tip: '✗ No training logged' };
      const active = getActiveExercises(logDay);
      const rested = entry.restedTypes || [];
      const restedCount = active.filter(t => rested.includes(t)).length;
      const xp = Math.round(timeline.perDay[logDay] || 0);
      const xpStr = (timeline.restPenalty[logDay] ? ' · ⚠ rest penalty' : '') + ' · ' + (xp > 0 ? '+' : '') + xp + ' XP';
      if (timeline.restPenalty[logDay]) return { cls: 'incomplete', tip: '✗ Too much rest — penalty' + xpStr };
      if (active.length > 0 && restedCount === active.length) return { cls: 'rested', tip: '○ Full rest cycle' };
      if (isDayComplete(logDay, entry)) return restedCount > active.length / 2
        ? { cls: 'partial', tip: '◐ Cycle partial (mostly rest)' + xpStr }
        : { cls: 'complete', tip: '✓ Quest completed' + xpStr };
      if (active.some(t => !rested.includes(t) && (entry[t] || 0) > 0)) return { cls: 'partial', tip: '◐ Cycle partial' + xpStr };
      return { cls: 'incomplete', tip: '✗ Cycle incomplete' };
    }
    let cellsHtml = '';
    cells.forEach(cell => {
      const st = cellStatus(cell);
      const tip = st.tip && (fmtDateShort(cell.logDay) + ' – ' + fmtDateShort(cell.endDay) + ' · ' + st.tip);
      cellsHtml += '<div class="heatmap-cell heatmap-cell--' + st.cls + (cell.isCurrent ? ' is-today' : '') + '" title="' + escapeHtml(tip) + '"></div>';
    });
    const gridStyle = 'grid-template-columns: repeat(' + COLS + ', minmax(0, var(--hm-max)));';
    const legend = '<div class="heatmap-legend">'+
      '<div class="legend-item"><div class="heatmap-cell heatmap-cell--incomplete"></div><span>Missed</span></div>'+
      '<div class="legend-item"><div class="heatmap-cell heatmap-cell--partial"></div><span>Partial</span></div>'+
      '<div class="legend-item"><div class="heatmap-cell heatmap-cell--complete"></div><span>Complete</span></div>'+
      '<div class="legend-item"><div class="heatmap-cell heatmap-cell--rested"></div><span>Rest</span></div>'+
      '<div class="legend-item"><div class="heatmap-cell heatmap-cell--frozen"></div><span>Frozen</span></div>'+
    '</div>';
    const subtitleText = total === 1 ? 'Current cycle' : (fmtDateShort(cells[0].logDay) + ' — ' + fmtDateShort(todayStr));
    const inner = '<div class="heatmap-header"><div class="heatmap-title">Training History</div><div class="heatmap-subtitle">' + subtitleText + '</div></div>' +
      '<div class="heatmap-scroll"><div class="heatmap-inner" style="--weeks:' + COLS + ';">' +
      '<div class="heatmap-month-row" style="' + gridStyle + '">' + monthRow + '</div>' +
      '<div class="heatmap-grid" style="' + gridStyle + '">' + cellsHtml + '</div>' +
      '</div></div>' + legend;
    return sysPanel(inner, 'heatmap-panel');
  }

  function renderLogs(){
    const heatmap = renderHeatmap();
    const keys = Array.from(new Set([...Object.keys(logs), ...Object.keys(penalties), ...Object.keys(frozenDays)])).sort().reverse();
    if(keys.length===0){
      return '<h1 class="page-title">Mission Log</h1>' + heatmap + renderFreezeButton() + sysPanel('<div class="empty-msg"><span class="tag">[ NO RECORDS FOUND ]</span>Complete your first cycle to begin the log.</div>');
    }
    const timeline = computeXPTimeline();
    let out = '<h1 class="page-title">Mission Log</h1>' + heatmap + renderFreezeButton();
    for(const k of keys){
      const entry = logs[k] || {};
      const failed = !!penalties[k];
      const frozen = !!frozenDays[k];
      const xp = Math.round(timeline.perDay[k] || 0);
      const active = getActiveExercises(k);
      const prof = getProfileForDay(k);
      let items = '';
      const shown = new Set(active);
      for (const t of Object.keys(EXERCISE_REGISTRY)){ if ((entry[t] || 0) > 0) shown.add(t); }
      for(const type of Array.from(shown)){
        const val = entry[type]||0;
        const goal = getGoalForExercise(type, k);
        const done = val >= goal;
        const rested = entry.restedTypes && entry.restedTypes.includes(type);
        let displayVal, cls = 'log-item';
        if (frozen) displayVal = '—';
        else if (rested) { displayVal = 'Rested'; cls += ' rested'; }
        else if (done) { displayVal = val.toLocaleString(); cls += ' done'; }
        else displayVal = val.toLocaleString();
        items += '<div class="'+cls+'"><span>'+LABELS[type]+'</span><span class="val">'+displayVal+'</span></div>';
      }
      const xpCls = frozen ? 'frozen' : (failed ? 'penalty' : '');
      let tagLine = '';
      if (frozen) tagLine = '<div class="frozen-tag">CYCLE FREEZE USED — NO PENALTY, NO XP</div>';
      else if (failed) tagLine = '<div class="fail-tag">CYCLE FAILED — 48H WINDOW EXPIRED</div>';
      if (timeline.restPenalty[k]) tagLine += '<div class="fail-tag">REST PENALTY — TOO MANY REST-HEAVY CYCLES IN A ROW</div>';
      if (prof) tagLine += '<div class="frozen-tag" style="border-color:var(--line-dim);color:var(--text-dim);background:var(--accent-soft);box-shadow:none;">PROFILE: ' + escapeHtml(prof.name) + '</div>';
      out += sysPanel('<div class="ldate">'+fmtDate(k)+' <span class="dow">'+dowOf(k)+'</span><span class="xp '+xpCls+'">'+(xp>=0?'+':'')+xp+' XP</span></div>'+tagLine+'<div class="log-grid">'+items+'</div>', 'log-day');
    }
    return out;
  }

  function getDynamicLineColor(ratio){
    if (ratio < 0.45) return '#00f0ff';
    if (ratio < 0.75) return '#0088ff';
    if (ratio < 0.95) return '#b10040';
    return '#ff0033';
  }

  function renderProfile(){
    const effective = totalXP();
    const lv = calcLevel(effective);
    const rk = rankOf(lv.level);
    const streaks = calcStreaks();
    const currentMultiplier = getMultiplierForRank(rk);
    const thresholds = getRankThresholds();
    const rankOrder = ['E','D','C','B','A','S','SS','Monarch'];
    const currentRankIdx = rankOrder.indexOf(rk);
    const startRankXP = thresholds[rk];
    const nextRankKey = rankOrder[currentRankIdx + 1] || 'Monarch';
    const endRankXP = thresholds[nextRankKey];
    let rankPct = 100;
    if (rk !== 'Monarch' && endRankXP > startRankXP) {
      rankPct = Math.min(100, Math.max(0, Math.round(((effective - startRankXP) / (endRankXP - startRankXP)) * 100)));
    }
    const maxXP = thresholds['Monarch'];
    const width = 300, height = 80;
    const pts = rankOrder.map((r, i) => {
      const xpVal = thresholds[r];
      const x = (i / (rankOrder.length - 1)) * width;
      const y = height - (xpVal / maxXP) * height;
      return { x, y, r, xpVal };
    });
    function getCurvePath(points){
      let d = `M ${points[0].x.toFixed(2)},${points[0].y.toFixed(2)}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p1 = points[i], p2 = points[i + 1];
        const dx = (p2.x - p1.x) / 3;
        let m1 = 0, m2 = 0;
        if (i > 0) m1 = (p2.y - points[i - 1].y) / (p2.x - points[i - 1].x);
        else m1 = (p2.y - p1.y) / (p2.x - p1.x);
        if (i < points.length - 2) m2 = (points[i + 2].y - p1.y) / (points[i + 2].x - p1.x);
        else m2 = (p2.y - p1.y) / (p2.x - p1.x);
        const cp1x = p1.x + dx, cp1y = p1.y + m1 * dx;
        const cp2x = p2.x - dx, cp2y = p2.y - m2 * dx;
        d += ` C ${cp1x.toFixed(2)},${cp1y.toFixed(2)} ${cp2x.toFixed(2)},${cp2y.toFixed(2)} ${p2.x.toFixed(2)},${p2.y.toFixed(2)}`;
      }
      return d;
    }
    const userIndexProgress = Math.min(rankOrder.length - 1,
      currentRankIdx + (rk === 'Monarch' ? 0 : (effective - startRankXP) / (endRankXP - startRankXP)));
    const userX = (userIndexProgress / (rankOrder.length - 1)) * width;
    const clampedXP = Math.min(effective, maxXP);
    const userY = height - (clampedXP / maxXP) * height;
    const progressRatio = Math.min(1, Math.max(0, clampedXP / maxXP));
    const dynamicProgressColor = getDynamicLineColor(progressRatio);
    const fullCurve = getCurvePath(pts);
    const activeIntegralD = `${fullCurve} L ${userX.toFixed(2)},${height} L 0,${height} Z`;
    const overviewSvg = '<div class="graph-container"><div class="graph-title">SYSTEM INTEGRAL PROGRESSION</div><svg viewBox="-10 -10 320 115" class="graph-svg"><defs><clipPath id="integralClip"><rect x="0" y="-10" width="'+userX.toFixed(2)+'" height="'+(height + 20)+'" /></clipPath><linearGradient id="areaGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00f0ff" stop-opacity="0.5"/><stop offset="50%" stop-color="#8a2be2" stop-opacity="0.3"/><stop offset="100%" stop-color="#8b0000" stop-opacity="0.15"/></linearGradient><linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00f0ff"/><stop offset="45%" stop-color="#0088ff"/><stop offset="75%" stop-color="#b10040"/><stop offset="100%" stop-color="#ff0033"/></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter></defs><path d="'+fullCurve+'" fill="none" stroke="var(--line-dim)" stroke-width="1.5" stroke-dasharray="3 3" /><path d="'+activeIntegralD+'" fill="url(#areaGrad)" clip-path="url(#integralClip)" /><path d="'+fullCurve+'" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" clip-path="url(#integralClip)" filter="url(#glow)" />'+pts.map(p => '<text x="'+p.x+'" y="'+(height + 15)+'" fill="'+(p.r === rk ? 'var(--accent)' : 'var(--text-dim)')+'" font-weight="'+(p.r === rk ? '700' : '400')+'" font-size="8" text-anchor="middle">'+p.r+'</text>').join('')+'<g transform="translate('+userX.toFixed(2)+', '+userY.toFixed(2)+')"><circle r="4" fill="'+dynamicProgressColor+'" filter="url(#glow)" /><circle r="3" fill="#ffffff" stroke="'+dynamicProgressColor+'" stroke-width="1.5" /></g></svg></div>';
    const topHtml = '<div class="profile-top"><div class="profile-row"><div class="rank-badge'+(rk.length > 2 ? ' long' : '')+'" style="color:'+getRankColor(rk)+';">'+rk+'</div><div class="profile-info"><div class="player-name" id="player-name">'+escapeHtml(profileName)+'</div><div class="rank-title">'+RANK_TITLES[rk]+'</div><div class="xp-block"><div class="lvl-row"><span>RANK <b>'+rk+'</b></span><span><b>'+Math.round(effective).toLocaleString()+'</b> / '+Math.round(endRankXP).toLocaleString()+' XP</span><span><b>'+rankPct+'%</b></span></div><div class="bar-track"><div class="bar-fill" style="width:'+rankPct+'%"></div></div></div><div class="flavor">"'+RANK_FLAVOR[rk]+'"</div></div></div></div>';
    const statsHtml = '<div class="stat-grid">'+
      '<div class="stat-item stat-mult" style="grid-column: span 2;"><div class="sv">'+lifetimeTotal('steps').toLocaleString()+'</div><div class="sl">TOTAL STEPS</div></div>'+
      '<div class="stat-item"><div class="sv">'+categoryTotal('arms').toLocaleString()+'</div><div class="sl">TOTAL ARMS REPS</div></div>'+
      '<div class="stat-item"><div class="sv">'+categoryTotal('back').toLocaleString()+'</div><div class="sl">TOTAL BACK REPS</div></div>'+
      '<div class="stat-item"><div class="sv">'+categoryTotal('chest').toLocaleString()+'</div><div class="sl">TOTAL PECTORAL REPS</div></div>'+
      '<div class="stat-item"><div class="sv">'+categoryTotal('abs').toLocaleString()+'</div><div class="sl">TOTAL ABDOMINAL REPS</div></div>'+
      '<div class="stat-item"><div class="sv">'+categoryTotal('legs').toLocaleString()+'</div><div class="sl">TOTAL LEGS REPS</div></div>'+
      '<div class="stat-item"><div class="sv">'+Object.keys(logs).length+'</div><div class="sl">CYCLES TRAINED</div></div>'+
      '<div class="stat-item"><div class="sv">'+streaks.current+'</div><div class="sl">CURRENT STREAK</div></div>'+
      '<div class="stat-item"><div class="sv">'+streaks.longest+'</div><div class="sl">LONGEST STREAK</div></div>'+
      '<div class="stat-item stat-mult" style="grid-column: span 2;"><div class="sv">'+currentMultiplier+'x</div><div class="sl">CURRENT RANK MULTIPLIER</div></div>'+
    '</div>';
    const panel = sysPanel(statsHtml + overviewSvg);
    return '<div class="profile-container"><h1 class="page-title">Hunter Profile</h1>'+topHtml+panel+'</div>';
  }

  /* ---------- Profile actions ---------- */
  /* Switching profiles is now allowed at ANY moment, including mid-cycle.
     - exercises present in both profiles keep their logged value / rest state
     - exercises that leave the profile are nullified (value 0, rest cleared)
     - exercises that join start from 0                                        */
  async function setActiveProfile(id){
    const p = getProfileById(id);
    if (!p) return;
    const changed = p.id !== activeProfileId;
    activeProfileId = p.id;
    saveActiveProfileId();

    let removedCount = 0;
    const c = getCurrentCycle();
    if (changed && c){
      const logDay = c.startDay;
      const entry = logs[logDay];
      if (entry){
        const valid = p.exercises.filter(x => EXERCISE_REGISTRY[x]);
        for (const t of Object.keys(EXERCISE_REGISTRY)){
          if (valid.indexOf(t) >= 0) continue;
          const had = (entry[t] || 0) > 0 || (Array.isArray(entry.restedTypes) && entry.restedTypes.indexOf(t) >= 0);
          if (had) removedCount++;
          entry[t] = 0;
        }
        if (Array.isArray(entry.restedTypes)) entry.restedTypes = entry.restedTypes.filter(x => valid.indexOf(x) >= 0);
        delete entry.exSnapshot;
        entry.profileId = p.id;
        await saveLogs();
      }
    }
    buzz(8);
    if (removedCount > 0){
      toast('[ SWITCHED ] ' + p.name + ' · ' + removedCount + ' exercise' + (removedCount === 1 ? '' : 's') + ' reset to 0', 'clear');
    } else {
      toast('Profile: ' + p.name, 'clear');
    }
    render();
  }
  async function createProfile(){
    if (profiles.length >= MAX_PROFILES){ toast('Max ' + MAX_PROFILES + ' profiles', 'warn'); return null; }
    const p = makeProfile('Profile ' + (profiles.length + 1), defaultExercises(), {});
    profiles.push(p);
    editingProfileId = p.id;
    saveProfiles();
    toast('[ NEW PROFILE ] Edit it in the menu', 'clear');
    render();
    return p;
  }
  async function deleteProfile(id){
    const p = getProfileById(id);
    if (!p) return;
    if (profiles.length <= 1){ toast('Cannot delete the only profile', 'warn'); return; }
    if (deletingProfileId !== id){ deletingProfileId = id; refreshMenu(); setTimeout(()=>{ if (deletingProfileId === id){ deletingProfileId = null; refreshMenu(); } }, 4000); return; }
    deletingProfileId = null;
    profiles = profiles.filter(x => x.id !== id);
    if (activeProfileId === id) activeProfileId = profiles[0].id;
    if (editingProfileId === id) editingProfileId = null;
    saveProfiles(); saveActiveProfileId();
    toast('[ PROFILE DELETED ]', 'clear');
    render();
  }

  function setupDelegatedHandlers(){
    ['app-content', 'menu-content'].forEach((id) => {
    const app = document.getElementById(id);
    if(!app) return;
    app.addEventListener('click', (e)=>{
      const actionBtn = e.target.closest('[data-action]');
      if (actionBtn){
        const act = actionBtn.dataset.action;
        const pid = actionBtn.dataset.profileId;
        if (act === 'select-profile'){ setActiveProfile(pid); return; }
        if (act === 'activate-profile'){ setActiveProfile(pid); return; }
        if (act === 'new-profile'){ createProfile(); return; }
        if (act === 'move-profile-up' || act === 'move-profile-down'){
          const i = profiles.findIndex(x => x.id === pid);
          const j = act === 'move-profile-up' ? i - 1 : i + 1;
          if (i >= 0 && j >= 0 && j < profiles.length){
            const tmp = profiles[i]; profiles[i] = profiles[j]; profiles[j] = tmp;
            saveProfiles(); buzz(8); refreshMenu();
          }
          return;
        }
        if (act === 'edit-profile'){
          editingProfileId = (editingProfileId === pid) ? null : pid;
          refreshMenu();
          return;
        }
        if (act === 'save-profile'){
          editingProfileId = null;
          saveProfiles();
          toast('[ PROFILE SAVED ]', 'clear');
          render();
          return;
        }
        if (act === 'delete-profile'){ deleteProfile(pid); return; }
      }
      const head = e.target.closest('.info-head');
      if (head && head.dataset.section) {
        const id = head.dataset.section;
        infoOpen[id] = !infoOpen[id];
        const panel = head.closest('.info-section');
        if (panel) panel.classList.toggle('open', infoOpen[id]);
        head.setAttribute('aria-expanded', infoOpen[id] ? 'true' : 'false');
        buzz(8);
        return;
      }
      const addBtn = e.target.closest('.add-btn');
      if (addBtn && addBtn.dataset.type) {
        const type = addBtn.dataset.type;
        const action = addBtn.dataset.action || 'add';
        if (action === 'rest') { handleAdd(type, 0, 'rest'); return; }
        if (action === 'step-up') { handleAdd(type, getStepAmount(type), 'add'); return; }
        if (action === 'step-down') { handleAdd(type, -getStepAmount(type), 'add'); return; }
        handleAdd(type, parseInt(addBtn.dataset.amt, 10), 'add');
        return;
      }
      if (e.target.closest('#undo-btn')) { performUndo(); return; }

  async function handleAdd(type, amt, action){
    syncFreeze();
    action = action || 'add';
    const cycle = getCurrentCycle();
    if (!cycle) return;
    const logDay = cycle.startDay;
    ensureEntry(logDay);
    if (frozenDays[logDay]) { buzz([8,40,8]); toast('[ FROZEN ] Stop the streak freeze first', 'warn'); return; }
    if (!logs[logDay].profileId && activeProfileId) logs[logDay].profileId = activeProfileId;
    const goal = getGoalForExercise(type, logDay);
    const prevVal = logs[logDay][type] || 0;
    const xpBefore = totalXP();
    const lvBefore = calcLevel(xpBefore).level;
    const isCurrentlyRested = logs[logDay].restedTypes.includes(type);
    if (action === 'rest') {
      if (isCurrentlyRested) {
        pushUndo(logDay, 'UN-REST · '+LABELS[type]);
        logs[logDay][type] = 0;
        logs[logDay].restedTypes = logs[logDay].restedTypes.filter(x => x !== type);
        await saveLogs();
        buzz(12);
        toast('↩️ Rest removed — '+LABELS[type]+' reset to 0', 'clear');
        render(); return;
      } else {
        pushUndo(logDay, 'REST · '+LABELS[type]);
        logs[logDay][type] = goal;
        if (!logs[logDay].restedTypes.includes(type)) logs[logDay].restedTypes.push(type);
        await saveLogs();
        buzz(12);
        const rp = computeXPTimeline();
        if (rp.restPenalty[logDay]) toast('[ REST ] '+LABELS[type]+' cleared  ·  REST PENALTY applied', 'warn');
        else if (rp.restHeavy[logDay]) toast('[ REST ] '+LABELS[type]+' cleared (0 XP)  ·  rest-heavy cycle '+rp.restStreakPerDay[logDay]+'/'+REST_GRACE_CYCLES+' before penalty', 'clear');
        else toast('[ REST ] '+LABELS[type]+' cleared (0 XP)', 'clear');
        render(); return;
      }
    }
    if (isCurrentlyRested) { buzz([8,40,8]); toast('[ LOCKED ] '+LABELS[type]+' is on rest – click Rest again to undo', 'clear'); return; }
    let newVal = prevVal + amt;
    if (newVal > goal) newVal = goal;
    if (newVal < 0) newVal = 0;
    if (newVal === prevVal) { buzz([8,40,8]); toast('⏳ Already at limit for '+LABELS[type], ''); return; }
    pushUndo(logDay, (amt > 0 ? '+' : '') + amt + ' ' + LABELS[type]);
    logs[logDay][type] = newVal;
    await saveLogs();
    const xpAfter = totalXP();
    const lvAfter = calcLevel(xpAfter).level;
    const deltaXP = xpAfter - xpBefore;
    const amtLabel = (amt > 0 ? '+' : '') + amt;
    const xpLabel = (deltaXP >= 0 ? '+' : '') + fmtXP(deltaXP);
    buzz(12);
    toast(amtLabel+' '+LABELS[type]+'  ·  '+xpLabel+' XP');
    if(prevVal < goal && logs[logDay][type] >= goal){
      setTimeout(()=>{ buzz([15,50,15]); toast('EXERCISE CLEARED — '+LABELS[type], 'clear'); }, 260);
    }
    if(lvAfter > lvBefore){
      const rkBefore = rankOf(lvBefore), rkAfter = rankOf(lvAfter);
      setTimeout(()=>showLevelUp(lvAfter, rkAfter, rkAfter!==rkBefore), 550);
    }
    render();
  }

  /* ---------- Daily reminders ---------- */
  const REM_CACHE = 'awakening-state', REM_URL = './__reminder-state.json';

  let _notifIcon = null, _notifBadge = null;
  function notifIconUrl(){
    if (_notifIcon) return _notifIcon;
    try {
      const s = 192, c = document.createElement('canvas');
      c.width = c.height = s;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, s, s);
      g.addColorStop(0, '#0a0a0f'); g.addColorStop(1, '#12121f');
      x.fillStyle = g; x.fillRect(0, 0, s, s);
      x.strokeStyle = '#00f0ff'; x.lineWidth = 9; x.lineCap = 'round';
      x.beginPath(); x.arc(s/2, s/2, 60, 0, Math.PI*2); x.stroke();
      x.beginPath(); x.arc(s/2, s/2, 34, 0, Math.PI*2); x.stroke();
      x.beginPath(); x.arc(s/2, s/2, 12, 0, Math.PI*2);
      x.fillStyle = '#ff2bd6'; x.fill();
      for (let i = 0; i < 4; i++){
        const a = i * Math.PI / 2;
        x.beginPath();
        x.moveTo(s/2 + Math.cos(a)*76, s/2 + Math.sin(a)*76);
        x.lineTo(s/2 + Math.cos(a)*90, s/2 + Math.sin(a)*90);
        x.stroke();
      }
      _notifIcon = c.toDataURL('image/png');
    } catch(e){ _notifIcon = 'icon-512.png'; }
    return _notifIcon;
  }
  function notifBadgeUrl(){
    if (_notifBadge) return _notifBadge;
    try {
      const s = 96, c = document.createElement('canvas');
      c.width = c.height = s;
      const x = c.getContext('2d');
      x.strokeStyle = '#ffffff'; x.lineWidth = 8;
      x.beginPath(); x.arc(s/2, s/2, 32, 0, Math.PI*2); x.stroke();

    } catch(e){ _notifBadge = 'icon-192.png'; }
    return _notifBadge;
  }

  async function checkReminders(){
    if (!reminderCfg.enabled) return;
    const st = await readRemState();
    const now = new Date(), today = todayKey(), mins = now.getHours()*60 + now.getMinutes();
    if (st.sentDay !== today) { st.sent = {}; st.sentDay = today; }
    st.sent = st.sent || {};
    let changed = false;
    for (const s of remSlots()){
      if (st.sent[s.id]) continue;
      const late = mins - remToMins(s.time);
      if (late < 0 || late > REMINDER_GRACE_MIN) continue;
      st.sent[s.id] = true; changed = true;
      if (!questPending()) continue;
      const body = reminderText(s.id);
      if (document.visibilityState === 'visible') toast(body);
      else if (notifGranted()) await showReminder(body);
    }
    if (changed) await writeRemState(stampRemState(st));
  }

    const ymd = dt => dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate());
    const start = new Date(c.startMs);
    const dayN = n => new Date(start.getFullYear(), start.getMonth(), start.getDate() + n);
    const stamp = ymd(new Date()) + 'T000000Z';
    const ev = (uid, date, time, summary, desc) => ['BEGIN:VEVENT', 'UID:' + uid, 'DTSTAMP:' + stamp,
      'DTSTART:' + ymd(date) + 'T' + time.replace(':', '') + '00', 'DURATION:PT15M', 'RRULE:FREQ=DAILY;INTERVAL=' + CYCLE_DAYS,
      'SUMMARY:' + summary, 'DESCRIPTION:' + desc,

    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Awakening Path//EN']

      const newlyFailed = Object.keys(penalties).filter(k=>!failedBefore.has(k));
      if(newlyFailed.length === 1) toast('48H WINDOW EXPIRED — CYCLE FAILED  ·  -'+DAILY_PENALTY+' XP', 'clear');
      else if(newlyFailed.length > 1) toast(newlyFailed.length+' CYCLES FAILED  ·  -'+(DAILY_PENALTY*newlyFailed.length)+' XP', 'clear');
      render();
    } else if(document.getElementById('hud-lvl')){
      updateHud();
    }
  }, 60000);

  let lastCycleIdx = null;
  let clockTimer = null;
  function tickClock(){
    const clockEl = document.getElementById('day-timer-clock');
    const timer = timeUntilDeadline();
    if (clockEl) {
      if (clockEl.textContent !== timer.text) clockEl.textContent = timer.text;
      clockEl.classList.toggle('urgent', timer.totalMs > 0 && timer.totalMs < 3600000);
    }
    const c = getCurrentCycle();
    if (c && c.index !== lastCycleIdx){
      lastCycleIdx = c.index;
      judgeCycles().then(() => { snapshotPastDays(); render(); });
    }
    clockTimer = setTimeout(tickClock, 1000 - (Date.now() % 1000));
  }
  function syncClock(){ if (clockTimer) clearTimeout(clockTimer); tickClock(); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncClock(); });
  window.addEventListener('focus', syncClock);
  window.addEventListener('pageshow', syncClock);
  syncClock();

  init();
})();
</script>
</body>
</html>
